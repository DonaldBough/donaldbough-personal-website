<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Donald Bough</title>
    <meta name="description" content="Donald Bough's personal website: an explorable 3D laboratory built with Three.js and WebGPU." />
    <meta name="theme-color" content="#07060f" />
    <link rel="canonical" href="https://donaldbough.com/" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/social/favicon-32.png" />
    <link rel="apple-touch-icon" href="assets/social/apple-touch-icon.png" />

    <!-- Link previews (iMessage, Slack, Facebook, LinkedIn, Discord read Open Graph; X reads the twitter: tags). Image URLs must be absolute. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Donald Bough" />
    <meta property="og:title" content="Donald Bough" />
    <meta property="og:description" content="Check out my 3D laboratory showcase in your browser." />
    <meta property="og:url" content="https://donaldbough.com/" />
    <meta property="og:image" content="https://donaldbough.com/assets/social/og-image.jpg" />
    <meta property="og:image:secure_url" content="https://donaldbough.com/assets/social/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Donald Bough smiling, next to neon text reading DONALDBOUGH.COM" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Donald Bough" />
    <meta name="twitter:description" content="Check out my 3D laboratory showcase in your browser." />
    <meta name="twitter:image" content="https://donaldbough.com/assets/social/og-image.jpg" />
    <meta name="twitter:image:alt" content="Donald Bough smiling, next to neon text reading DONALDBOUGH.COM" />
    <link rel="stylesheet" href="css/style.css" />

    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/build/three.webgpu.js",
          "three/webgpu": "./vendor/three/build/three.webgpu.js",
          "three/tsl": "./vendor/three/build/three.tsl.js",
          "three/addons/": "./vendor/three/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="app"></div>

    <div id="hud">
      <div id="crosshair"></div>
      <div id="prompt" class="hidden"></div>
      <div id="stats"></div>
    </div>

    <div id="inspect" class="hidden">
      <h2 id="inspect-title"></h2>
      <p id="inspect-body"></p>
      <span class="hint">[E] close</span>
    </div>

    <div id="touch-ui" class="hidden">
      <div id="joystick" class="hidden"><div id="joystick-knob"></div></div>
      <button id="btn-pause" aria-label="Pause">II</button>
      <button id="btn-flashlight" aria-label="Flashlight">&#128294;</button>
      <button id="btn-interact" aria-label="Interact">&#9995;</button>
    </div>

    <div id="overlay">
      <h1>LAB 07</h1>
      <p class="subtitle">Donald Bough — Research Facility</p>
      <button id="start">Click to enter</button>
      <p class="controls" id="controls-help">
        WASD move &middot; Mouse look &middot; Shift sprint &middot; E interact &middot; F flashlight &middot; Esc pause
      </p>
      <p id="status"></p>
    </div>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
